name: Build and publish TIGER
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tiger-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pinned site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install the locked build dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and verify the locked public release
        run: python tools/fetch_release.py
      - name: Validate the versioned database comparison
        run: python tools/verify_comparison.py
      - name: Build the site for this repository path
        env:
          TIGER_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python tools/build_site.py --base-path "${TIGER_BASE_PATH%/}/"
      - name: Validate public files, links, counts and size
        run: python tools/verify_dist.py
      - name: Upload only the validated static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
